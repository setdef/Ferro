[package]
name = "ferro_url"
version = "0.1.0-pre.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# url's std (its default) is built. serde reaches only Rust (ADR 002), so
# nothing here uses it; expose_internals adds only items to url's
# #[doc(hidden)] quirks module, which the gem does not bind, and
# debugger_visualizer names a file the published crate lacks, so all three
# are off.
url = "=2.5.8"
# url's own form_urlencoded, named because the native layer writes to its
# Serializer over a String target (plan 005, decision 19).
form_urlencoded = "=1.2.2"
magnus = { version = "0.9.3", features = ["bytes", "rb-sys"] }
rb-sys = "0.9.130"

[features]
# Hooks the gem's own tests read inside the native layer, such as how many
# waits released the GVL. url has no such methods, and a gem adds nothing
# its crate lacks, so only the repository's development and test builds
# turn this on (ADR 001, amendment of 2026-11-05: test hooks). The hooks
# are off unless the installer passes `--enable-test-hooks` to extconf.rb,
# which only the repository's own build does, and it is no option an app
# chooses (ADR 002).
test-hooks = []

# Each crate states its lints itself instead of inheriting them with
# `workspace = true`: an installed gem ships only its own workspace.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
# Every unsafe block carries a SAFETY comment (AGENTS.md).
undocumented_unsafe_blocks = "deny"

# Unsafe code is denied. An exception gets #[allow(unsafe_code)] on its
# block, a SAFETY comment citing its source, and a test (AGENTS.md).
[lints.rust]
unsafe_code = "deny"
