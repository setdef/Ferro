[package]
name = "ferro_arboard"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Every arboard feature is built in (ADR 002, decision 1; plan 001,
# decision 15): image-data, the default, adds ImageData and the image
# methods, and implies core-graphics, image, and windows-sys;
# wayland-data-control adds the Wayland clipboard, whose client is pure
# Rust, and implies wl-clipboard-rs. Ruby reaches each, none excludes
# another, and none needs a system library, so none is dropped or offered,
# and the crate declares no [features] of its own.
arboard = { version = "=3.7.0", features = ["image-data", "wayland-data-control"] }
magnus = { version = "0.9.3", features = ["bytes", "rb-sys"] }
rb-sys = "0.9.130"

# The PNG encoder arboard uses on Linux and Windows, at the version
# Cargo.lock pins and with the feature arboard enables there, so a Rust
# test can drive the panic the image guard refuses (plan 001, decision 4).
[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[features]
# Hooks the gem's own tests read inside the native layer, such as how many
# calls released the GVL. arboard has no such method, and a gem adds nothing
# its crate lacks, so only the repository's development and test builds turn
# this on (ADR 001, amendment of 2026-11-05: test hooks). The hooks are off
# unless the installer passes `--enable-test-hooks` to extconf.rb, which
# only the repository's own build does, and it is no option an app
# chooses (ADR 002).
test-hooks = []

# Each crate states its lints itself instead of inheriting them with
# `workspace = true`: an installed gem ships only its own workspace.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
# Every unsafe block carries a SAFETY comment (AGENTS.md), adopted from
# RatatuiRuby's crate.
undocumented_unsafe_blocks = "deny"

# Unsafe code is denied. An exception gets #[allow(unsafe_code)] on its
# block, a SAFETY comment citing its source, and a test (AGENTS.md).
[lints.rust]
unsafe_code = "deny"
