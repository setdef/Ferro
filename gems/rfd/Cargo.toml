# The ferro-rfd gem's Cargo workspace. It ships in the gem beside
# Cargo.lock, so an installed gem compiles against exactly the dependency
# versions this repository tests (ADR 001, section 3).

[workspace]
members = ["ext/ferro_rfd"]
resolver = "2"

# Keep symbols in released builds, as ferro-arboard does, so a crash or
# panic backtrace from an installed gem names Ferro's and rfd's functions.
# Debug info stays off (plan 001, decision 19). Profiles take effect only at
# the workspace root, so this lives here, beside the lockfile the gem ships.
[profile.release]
debug = false
strip = false
