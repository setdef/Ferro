[package]
name = "ferro_idna"
version = "0.1.0-pre.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# idna's three features, std, alloc, and compiled_data, are its defaults
# (plan 006, decision 2).
idna = "=1.1.0"
magnus = { version = "0.9.3", features = ["bytes"] }
rb-sys = "0.9.130"

# Each crate states its lints itself instead of inheriting them with
# `workspace = true`: an installed gem ships only its own workspace.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
# Every unsafe block carries a SAFETY comment (AGENTS.md).
undocumented_unsafe_blocks = "deny"

# Unsafe code is denied. An exception gets #[allow(unsafe_code)] on its
# block, a SAFETY comment citing its source, and a test (AGENTS.md).
[lints.rust]
unsafe_code = "deny"
