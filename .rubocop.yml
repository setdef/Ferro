inherit_from:
  - ./vendor/goodcop/base.yml

# Merge Include with RuboCop's defaults rather than replace them, so the
# hidden .agents directory (agent skill scripts) is linted too.
inherit_mode:
  merge:
    - Include

AllCops:
  TargetRubyVersion: "4.0"
  NewCops: disable
  SuggestExtensions: false
  Include:
    - ".agents/**/*.rb"
  Exclude:
    - "tmp/**/*"
    - "target/**/*"
    - "gems/*/tmp/**/*"
    - "vendor/bundle/**/*"

# RDoc mis-parses endless methods: the methods after one lose their comments
# and visibility (doc/contributors/documentation_style.md, section 5). Every
# file RDoc reads uses def ... end.
Style/EndlessMethod:
  Enabled: true
  EnforcedStyle: disallow
  Include:
    - "gems/*/lib/**/*.rb"

# ferro-time defines Ferro::Time and Ferro::Time::Date, so a bare Time or
# Date inside module Ferro can name the binding instead of Ruby's class
# wherever ferro-time is bundled. Every other gem names Ruby's from the
# top level (ADR 001, amendment of 2026-10-27);
# test/tasks/test_top_level_constants.rb checks the signatures.
Lint/ConstantResolution:
  Enabled: true
  Only:
    - Time
    - Date
  Include:
    - "gems/*/lib/**/*.rb"
  Exclude:
    - "gems/time/**/*"
